/* ✅ undefined 값이 섞여도 Firestore 쓰기가 실패하지 않도록 (쓰기 실패 → 로컬만 체크되고 서버는 원복되는 현상 방지) */

const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------- 1) 유틸 ---------- */
async function sha256(str){
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const Local = {
  get:(k,d=null)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{return d;} },
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),
  del:(k)=>localStorage.removeItem(k)
};
/* 깊은 복사 (참조 공유 차단 + undefined 제거) */
const deepClone = (v) => (v === undefined ? v : JSON.parse(JSON.stringify(v)));
/* 하루 레코드 기본 형태 */
const EMPTY_DAY = () => ({ arrival:'', weather:'', mood:'', timetable:[], selfStudy:[], homework:[], lunchBrushing:{checked:false}, learningNotes:[], teacherComment:'', completed:false });

const Store = {
  data: {},
  listeners: {},
  subscribe: (k, fn) => {
    if(!Store.listeners[k]) Store.listeners[k] = [];
    Store.listeners[k].push(fn);
    return () => { Store.listeners[k] = Store.listeners[k].filter(f=>f!==fn); };
  },
  get: (k, d=null) => Store.data[k] !== undefined ? Store.data[k] : d,
  _notify: (k, v) => { (Store.listeners[k]||[]).forEach(fn => fn(v)); },
  /* 전체 문서 저장 (class, dailyNotice, stamps 등 소규모 문서용) */
  set: async (k, v) => {
    const newValue = deepClone(v);
    Store.data[k] = newValue;
    Store._notify(k, newValue);
    if(window.dbRef) {
      try { await window.dbRef.doc(k).set({ value: newValue }, { merge: false }); }
      catch(e) { console.error('Firestore 저장 에러:', e); }
    }
  },
  /* 최신 상태 기준 함수형 업데이트 */
  update: (k, fn, def=null) => Store.set(k, fn(Store.get(k, def))),
  /* ✅ 날짜 레코드 부분 저장
     - 최신 Store 상태를 기준으로 병합 (stale closure 차단)
     - Firestore 에는 변경된 필드만 mergeFields 로 기록 → 다른 기기/다른 날짜/다른 필드를 덮어쓰지 않음
     - patchOrFn 이 null 을 반환하면 아무것도 쓰지 않음 */
  patchDay: async (k, date, patchOrFn, meta) => {
    const all = Store.get(k, {}) || {};
    const prevDay = { ...EMPTY_DAY(), ...(all[date] || {}) };
    const patch = (typeof patchOrFn === 'function') ? patchOrFn(prevDay) : patchOrFn;
    if(!patch || Object.keys(patch).length === 0) return false;
    const nextDay = { ...prevDay, ...patch };
    const nextAll = { ...all, [date]: nextDay };
    if(meta && meta.cls && meta.student){
      nextDay.completed = computeCompleted(nextDay, meta.cls, date, meta.student, Store.get('dailyNotice', {}), nextAll);
    }
    const clean = deepClone(nextAll);
    Store.data[k] = clean;
    Store._notify(k, clean);
    if(window.dbRef){
      const fields = Array.from(new Set([...Object.keys(patch), 'completed']));
      const FP = firebase.firestore.FieldPath;
      const dayPayload = {};
      fields.forEach(f => { const v = clean[date][f]; dayPayload[f] = (v === undefined ? null : v); });
      try {
        await window.dbRef.doc(k).set({ value: { [date]: dayPayload } }, { mergeFields: fields.map(f => new FP('value', date, f)) });
      } catch(e) { console.error('Firestore 부분 저장 에러:', e); }
    }
    return true;
  }
};
async function initStore() {
  try {
    const snap = await window.dbRef.get();
    snap.forEach(doc => { Store.data[doc.id] = doc.data().value; });
    window.dbRef.onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if(change.type === 'added' || change.type === 'modified') {
          /* Firestore 스냅샷은 항상 '서버 상태 + 로컬 대기 중 쓰기' 가 합쳐진 값이므로 그대로 반영해도 로컬 변경이 되돌아가지 않음 */
          const k = change.doc.id; const v = change.doc.data().value;
          Store.data[k] = v;
          Store._notify(k, v);
        }
      });
    });
  } catch(e) { console.error("Firebase 초기화 에러:", e); }
}
function useSync(k, def) {
  const [val, setVal] = useState(() => Store.get(k, def));
  useEffect(() => {
    setVal(Store.get(k, def));
    return Store.subscribe(k, setVal);
  }, [k]);
  const setter = useCallback((v) => Store.set(k, typeof v === 'function' ? v(Store.get(k, def)) : v), [k]);
  return [val, setter];
}
const todayStr = (d=new Date())=>{ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; };
const dayKor = ['일','월','화','수','목','금','토'];
const weekKeys = ['mon','tue','wed','thu','fri'];
const weekLabel = {mon:'월',tue:'화',wed:'수',thu:'목',fri:'금'};
const nowHM = ()=>{ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const isoToLocalHM = (iso)=>{ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const hmToMin = (hm)=>{ if(!hm) return 0; const [h,m]=hm.split(':').map(Number); return h*60+m; };
const isoToLocalYMDHM = (iso) => {
  if (!iso) return '-'; const d = new Date(iso); if (isNaN(d)) return '-';
  const y = d.getFullYear(); const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0'); const h = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0'); return `${y}-${m}-${dd} ${h}:${min}`;
};

/* ---------- 2) 데모 데이터 시드 ---------- */
const AVATARS = ['🐱','🐶','🦖','🐰','🐻','🐼','🦁','🐯','🐵','🦊','🐧','🐸'];
const DEFAULT_SUBJECTS = [
  {name:'국어',color:'#FFD6A5',icon:'📖'}, {name:'수학',color:'#A0E7E5',icon:'🔢'},
  {name:'사회',color:'#B5EAD7',icon:'🌏'}, {name:'과학',color:'#C7CEEA',icon:'🔬'},
  {name:'영어',color:'#FFC8DD',icon:'🔤'}, {name:'체육',color:'#FDFFB6',icon:'⚽'},
  {name:'음악',color:'#E0BBE4',icon:'🎵'}, {name:'미술',color:'#FFDAC1',icon:'🎨'},
];
const SUBJECT_ICON_PRESETS = ['📖','🔢','🌏','🔬','🔤','⚽','🎵','🎨','💻','🏃‍♂️','🧪','📐','🌱','🍳','🧩','✍️'];
const DEFAULT_SELF_STUDY_TYPES = ['한자','영어','수학','독서','논술','만들기','그림그리기','기타'];
const NOTE_LENGTH_OPTIONS = [10, 15, 20, 30, 40, 50];
/* class.selfStudyTypes 안전 fallback */
const getSelfStudyTypes = (cls) => {
  if (cls && Array.isArray(cls.selfStudyTypes) && cls.selfStudyTypes.length > 0) return cls.selfStudyTypes;
  return DEFAULT_SELF_STUDY_TYPES;
};
/* 학생별 배움노트 최소 글자수 안전 fallback */
const getMinNoteLength = (student) => {
  if (!student) return 10;
  const v = parseInt(student.minNoteLength, 10);
  return (Number.isFinite(v) && v > 0) ? v : 10;
};
/* 학생 객체 생성 (스키마 단일화) */
const makeStudent = (id, name, number, pinHash) => ({
  id, name, number, avatar: AVATARS[id % AVATARS.length],
  pinHash, pin: '0000', isPinChanged: false, lastLogin: null,
  minNoteLength: 10, createdAt: todayStr(), canViewDashboard: false
});

/* ---------- 3) 숙제 공통 로직 ---------- */
/* 동일 숙제 판별: 출처(fromTeacher) + 과목 + 내용 */
const sameHw = (a, b, flag) => (!!a.fromTeacher) === !!flag && a.subject === b.subject && a.content === b.content;
/* ✅ 전학생 필터: 출제일(또는 기한)이 계정 생성일보다 이전이면 숨김. createdAt 없으면 제한 없음 */
const isHwVisibleForStudent = (student, postedDate, hw) => {
  const c = student && student.createdAt;
  if(!c) return true;
  const ref = (hw && hw.due) || postedDate;
  return !(postedDate < c || ref < c);
};
/* ✅ 특정 날짜에 '기한(due)'인 숙제 목록 (완료 여부는 출제일 레코드에서 조회) + 그 날짜의 개인 학습 */
function hwItemsForDate(allNotice, allRec, date, student){
  const items = [];
  const an = allNotice || {}; const ar = allRec || {};
  Object.keys(an).sort().forEach(nd => {
    ((an[nd] || {}).homework || []).forEach(h => {
      if((h.due || nd) !== date) return;
      if(!isHwVisibleForStudent(student, nd, h)) return;
      const m = ((ar[nd] || {}).homework || []).find(x => sameHw(x, h, true));
      items.push({ ...h, fromTeacher: true, originDate: nd, done: !!(m && m.done), memo: (m && m.memo) || '' });
    });
  });
  ((ar[date] || {}).homework || []).filter(h => !h.fromTeacher).forEach(h => items.push({ ...h, originDate: date }));
  return items;
}
/* ✅ 숙제 완료 상태를 '명시적인 값'으로 설정 (반전 아님) — 최신 Store 기준, 식별자 매칭 */
function setHomeworkDone(student, originDate, hw, isFromTeacher, done, cls){
  const flag = !!isFromTeacher;
  return Store.patchDay(`records_${student.id}`, originDate, (day) => {
    const list = day.homework || [];
    const idx = list.findIndex(x => sameHw(x, hw, flag));
    if(idx >= 0){
      if(!!list[idx].done === !!done) return null;
      const next = [...list]; next[idx] = { ...next[idx], done: !!done };
      return { homework: next };
    }
    return { homework: [...list, { subject: hw.subject, content: hw.content, due: hw.due || originDate, fromTeacher: flag, memo: hw.memo || '', done: !!done }] };
  }, { cls, student });
}
function setHomeworkMemo(student, originDate, hw, isFromTeacher, memo, cls){
  const flag = !!isFromTeacher;
  return Store.patchDay(`records_${student.id}`, originDate, (day) => {
    const list = day.homework || [];
    const idx = list.findIndex(x => sameHw(x, hw, flag));
    if(idx >= 0){
      if((list[idx].memo || '') === memo) return null;
      const next = [...list]; next[idx] = { ...next[idx], memo };
      return { homework: next };
    }
    return { homework: [...list, { subject: hw.subject, content: hw.content, due: hw.due || originDate, fromTeacher: flag, memo, done: !!hw.done }] };
  }, { cls, student });
}


function useToast(){
  const [msg,setMsg]=useState('');
  const show=(m)=>{ setMsg(m); setTimeout(()=>setMsg(''),1600); };
  const view = msg ? <div className="toast">{msg}</div> : null;
  return [show, view];
}

/* ---------- 4) 루트 및 앱 ---------- */
function Root() {
  const [ready, setReady] = useState(false);
  useEffect(() => {
    // async 키워드와 await seedIfEmpty(); 줄을 모두 지웠습니다.
    initStore().then(() => {
      setReady(true);
    });
  }, []);
// ...
  if(!ready) return <div className="min-h-screen flex items-center justify-center flex-col gap-4"><div className="text-4xl animate-bounce">🔥</div><div className="text-xl font-bold text-gray-600">서버와 연결하는 중...</div></div>;
  return <App />;
}
function App(){
  const [session,setSession]=useState(Local.get('session'));
  const [view,setView]=useState('role');
  const [tmpStudent,setTmpStudent]=useState(null);
  const [toast,toastView]=useToast();
  useEffect(()=>{
    const s = Local.get('session'); if(!s){ setView('role'); return; }
    const now = Date.now();
    if(s.keepLogin){ if(now - s.loginAtMs > 30*24*3600*1000){ logout(); return; } }
    else { if(now - (s.lastActiveMs||s.loginAtMs) > 30*60*1000){ logout(); return; } }
    setSession(s); setView(s.role==='teacher' ? 'teacherApp' : 'studentApp');
  },[]);
  const logout = ()=>{ Local.del('session'); setSession(null); setView('role'); };
  const touch = ()=>{ const s=Local.get('session'); if(s){ s.lastActiveMs=Date.now(); Local.set('session',s); } };
  useEffect(()=>{
    const h=()=>touch(); window.addEventListener('click',h); window.addEventListener('keydown',h);
    return ()=>{ window.removeEventListener('click',h); window.removeEventListener('keydown',h); };
  },[]);
  return (
    <div className="min-h-screen">
      {toastView}
      {view==='role' && <RoleSelect onPick={(r)=>setView(r==='student'?'studentLogin':'teacherLogin')} />}
      {view==='studentLogin' && <StudentLogin onBack={()=>setView('role')} onLogged={(stu, sess)=>{ Local.set('session', sess); setSession(sess); if(!stu.isPinChanged){ setTmpStudent(stu); setView('pinChange'); } else setView('studentApp'); }} toast={toast}/>}
      {view==='pinChange' && <PinChange student={tmpStudent} onDone={()=>{ setTmpStudent(null); setView('studentApp'); toast('환영해요! 🎉'); }} toast={toast}/>}
      {view==='teacherLogin' && <TeacherLogin onBack={()=>setView('role')} onLogged={(sess)=>{ Local.set('session',sess); setSession(sess); setView('teacherApp'); }} toast={toast}/>}
      {view==='studentApp' && session && <StudentApp session={session} logout={logout} toast={toast}/>}
      {view==='teacherApp' && session && <TeacherApp session={session} logout={logout} toast={toast}/>}
    </div>
  );
}
function RoleSelect({onPick}){
  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-6">
      <h1 className="text-3xl md:text-4xl font-extrabold mb-2">🌈 오늘의 학교생활 체크</h1>
      <p className="text-gray-600 mb-8">우리 반 친구들과 즐겁게 기록해요!</p>
      <div className="grid gap-5 w-full max-w-md">
        <button onClick={()=>onPick('student')} className="pastel-card text-2xl py-8 hover:bg-orange-50">🧒 학생 로그인</button>
        <button onClick={()=>onPick('teacher')} className="pastel-card text-2xl py-8 hover:bg-blue-50">👩‍🏫 선생님 로그인</button>
      </div>
    </div>
  );
}
function StudentLogin({onBack,onLogged,toast}){
  const [cls, setCls] = useSync('class');
  const [picked,setPicked]=useState(null); const [pin,setPin]=useState('');
  const [keep,setKeep]=useState(false); const [fails,setFails]=useState(Local.get('loginFails')||{});
  const lockKey = picked ? `s${picked.id}` : null; const lockedUntil = lockKey ? (fails[lockKey]?.lockedUntil||0) : 0;
  const isLocked = Date.now()<lockedUntil;
  const [,setTick]=useState(0); useEffect(()=>{ if(isLocked){ const t=setInterval(()=>setTick(x=>x+1),500); return ()=>clearInterval(t); } },[isLocked]);
  const tryLogin = async ()=>{
    if(pin.length!==4){ toast('PIN 4자리를 입력해요'); return; }
    const h = await sha256(pin);
    /* pinHash 우선, 없으면 평문 pin 으로 fallback */
    const ok = picked.pinHash ? (h === picked.pinHash) : (picked.pin !== undefined && picked.pin !== null && String(picked.pin) === pin);
    if(ok){
      const nowIso = new Date().toISOString();
      /* 로그인 성공 시 평문 pin 이 없는 기존 학생은 자동 백필 */
      const students = cls.students.map(s => s.id===picked.id ? {...s, lastLogin: nowIso, pin: (s.pin ?? pin), pinHash: s.pinHash || h} : s);
      const cls2 = {...cls, students}; setCls(cls2);
      const me = students.find(s=>s.id===picked.id);
      const f={...fails}; delete f[lockKey]; Local.set('loginFails',f); setFails(f);
      const sess = {role:'student', studentId:picked.id, loginAt:nowIso, loginAtMs:Date.now(), lastActiveMs:Date.now(), keepLogin:keep};
      onLogged(me, sess);
    } else {
      const f={...fails}; const cur = f[lockKey]||{count:0}; cur.count = (cur.count||0)+1;
      if(cur.count>=5){ cur.lockedUntil = Date.now()+30000; cur.count=0; toast('5회 실패! 30초 잠금 🔒'); } else toast(`PIN이 달라요. 다시 입력해보세요! (${cur.count}/5)`);
      f[lockKey]=cur; Local.set('loginFails',f); setFails(f); setPin('');
    }
  };
  return (
    <div className="min-h-screen p-4 max-w-3xl mx-auto">
      <button onClick={onBack} className="mb-3 text-gray-600">← 처음으로</button>
      <h2 className="text-2xl font-bold mb-3">🧒 학생 로그인 — {cls?.name}</h2>
      {!picked ? (
        <div><p className="mb-3 text-gray-700">내 이름을 골라주세요!</p><div className="grid grid-cols-2 md:grid-cols-3 gap-3">
          {[...cls.students].sort((a,b)=>a.number-b.number).map(s=>(<button key={s.id} onClick={()=>setPicked(s)} className="pastel-card p-4 text-left hover:bg-pink-50"><div className="text-4xl">{s.avatar||'🙂'}</div><div className="text-xs text-gray-500">{s.number}번</div><div className="text-lg font-bold">{s.name}</div></button>))}
        </div></div>
      ) : (
        <div>
          <div className="pastel-card p-4 mb-4 flex items-center gap-3">
            <div className="text-4xl">{picked.avatar||'🙂'}</div>
            <div className="flex-1"><div className="text-xs text-gray-500">{picked.number}번</div><div className="text-xl font-bold">{picked.name}</div></div>
            <button onClick={()=>{setPicked(null);setPin('');}} className="text-gray-500 text-sm">바꾸기</button>
          </div>
          <div className="text-center text-3xl tracking-widest my-3 h-10">{('●'.repeat(pin.length)).padEnd(4,'○')}</div>
          {isLocked ? <div className="text-center text-red-500 my-4">🔒 잠시 멈췄어요. {Math.ceil((lockedUntil-Date.now())/1000)}초 후 다시 시도해 주세요.</div> : (
            <div className="grid grid-cols-3 gap-2 max-w-xs mx-auto">

/* ✅ 학생별 minNoteLength 기준 + 숙제는 '기한일(due)' 기준으로 판단 */
function computeProgress(rec, cls, date, student, allNotice, allRec){
  const minLen = getMinNoteLength(student);
  const an = allNotice || Store.get('dailyNotice', {});
  const baseRec = allRec || (student ? Store.get(`records_${student.id}`, {}) : {});
  const ar = { ...(baseRec||{}), [date]: rec };
  let done=0;
  if(rec.arrival) done++;
  if(rec.selfStudy && rec.selfStudy.length>0) done++;
  const hw = hwItemsForDate(an, ar, date, student);
  if(hw.length===0 || hw.every(h=>h.done)) done++;
  if(rec.lunchBrushing?.checked) done++;
  const tt = rec.timetable||[];
  const filledPeriods = tt.filter(Boolean).length;
  const notes = rec.learningNotes||[];
  const validNotes = notes.filter(n=>n.content?.length>=minLen).length;
  if(filledPeriods>0 ? validNotes>=filledPeriods : validNotes>0) done++;
  return {done, percent: Math.round((done/5)*100)};
}
function computeCompleted(rec, cls, date, student, allNotice, allRec){ return computeProgress(rec, cls, date, student, allNotice, allRec).done===5; }

/* 📌 학생용 숙제 탭 — 파생 뷰(마운트 시 자동 쓰기 없음) + 명시적 done 설정 + createdAt 필터 */
function TabHomework({rec,notice,toast,cls,allRec,allNotice,currentDate,student}){
  const recKey = `records_${student.id}`;
  /* 오늘 출제 숙제(선생님) + 오늘 개인 학습 — 저장 없이 렌더 시 병합 */
  const todayItems = useMemo(()=>{
    const cur = rec.homework||[];
    const teacher = (notice.homework||[])
      .filter(t=>isHwVisibleForStudent(student, currentDate, t))
      .map(t=>{ const m=cur.find(h=>sameHw(h,t,true)); return {...t, fromTeacher:true, done:!!(m&&m.done), memo:(m&&m.memo)||'', originDate:currentDate}; });
    const personal = cur.filter(h=>!h.fromTeacher).map(h=>({...h, originDate:currentDate}));
    return [...teacher, ...personal];
  },[rec.homework, notice, currentDate, student]);
  /* 과거 미완료 누적 */
  const pastUndone = useMemo(()=>{
    const items = [];
    const dateSet = new Set([...Object.keys(allNotice||{}), ...Object.keys(allRec||{})]);
    [...dateSet].filter(d => d < currentDate).sort().forEach(pd => {
      const pNotice = (allNotice||{})[pd] || {};
      const pRecHw = ((allRec||{})[pd] || {}).homework || [];
      (pNotice.homework||[]).filter(t=>isHwVisibleForStudent(student, pd, t)).forEach(t=>{
        const m = pRecHw.find(h=>sameHw(h,t,true));
        if(!(m && m.done)) items.push({...t, fromTeacher:true, done:false, memo:(m&&m.memo)||'', originDate:pd});
      });
      pRecHw.filter(h=>!h.fromTeacher && !h.done).forEach(h=>items.push({...h, originDate:pd}));
    });
    return items;
  }, [allNotice, allRec, currentDate, student]);
  /* ✅ 체크박스 값 그대로 설정 (반전 아님) → 다시 누르지 않는 한 절대 풀리지 않음 */
  const setDone = (item, checked)=>{
    setHomeworkDone(student, item.originDate, item, !!item.fromTeacher, checked, cls);
    if(item.originDate===currentDate){
      if(checked && todayItems.length>0 && todayItems.every(h=>h.done || sameHw(h, item, !!item.fromTeacher))) toast('모두 완료! ⭐⭐⭐');
    } else if(checked) toast('과거 숙제가 완료 처리되었어요! ✨');
  };
  const setMemo = (item, memoText)=>{
    if(memoText===(item.memo||'')) return;
    setHomeworkMemo(student, item.originDate, item, !!item.fromTeacher, memoText, cls);
    toast(item.originDate===currentDate ? '메모가 저장되었어요!' : '메모 저장!');
  };
  const [s,setS]=useState(''); const [c,setC]=useState('');
  const addPersonal = ()=>{
    if(!s||!c){toast('과목과 내용을 선택/입력해요');return;}
    Store.patchDay(recKey, currentDate, day=>({homework:[...(day.homework||[]), {subject:s,content:c,done:false,fromTeacher:false,memo:''}]}), {cls, student});
    setS('');setC('');
  };
  const removePersonal = (item)=>{
    Store.patchDay(recKey, currentDate, day=>{
      const list = day.homework||[]; const idx = list.findIndex(x=>sameHw(x,item,false)); if(idx<0) return null;
      const next=[...list]; next.splice(idx,1); return {homework:next};
    }, {cls, student});

function TabLearningNote({rec,update,cls,student,toast}){

  const subjMeta = (name)=>cls.subjects.find(s=>s.name===name);
  const setNote = (period, content)=>{
    const subj = tt[period-1]||'';
    update(day=>{
      const cur = day.learningNotes||[]; const next=[...cur];
      const i = next.findIndex(n=>n.period===period);
      if(i>=0){ if(next[i].content===content && next[i].subject===subj) return null; next[i] = {...next[i], subject:subj, content}; }
      else next.push({period, subject:subj, content});
      return {learningNotes:next};
    });
  };
  if(tt.filter(Boolean).length===0) return <div className="pastel-card p-4 text-center text-gray-500">먼저 🗓 시간표 탭에서 오늘 과목을 정해주세요!</div>;

/* 📌 내 기록 — 순서: 등교 → 자습 → 양치 → 배움노트 → 숙제(기한일 기준) */
function TabStudentDash({recKey, student, currentDate, cls}) {
  const [allRec] = useSync(recKey, {}); const [allNotice] = useSync('dailyNotice', {});
  const [startDate, setStartDate] = useState(() => { const d = new Date(currentDate); d.setDate(d.getDate() - 6); return todayStr(d); });
  const [endDate, setEndDate] = useState(currentDate); const [preset, setPreset] = useState('최근 7일');
  const handlePreset = (p) => {
    setPreset(p); const d = new Date(currentDate); let s, e;
    if(p === '오늘') { s = todayStr(d); e = todayStr(d); }
    else if(p === '이번 주') { const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); s = todayStr(new Date(d.setDate(diff))); e = todayStr(new Date(new Date(s).setDate(new Date(s).getDate() + 6))); }
    else if(p === '최근 7일') { e = todayStr(d); s = todayStr(new Date(new Date(d).setDate(d.getDate() - 6))); }
    else if(p === '이번 달') { s = todayStr(new Date(d.getFullYear(), d.getMonth(), 1)); e = todayStr(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
    else if(p === '전체') { const keys = Object.keys(allRec).sort(); s = keys.length > 0 ? keys[0] : currentDate; e = currentDate; }
    if(s) setStartDate(s); if(e) setEndDate(e);
  };
  const dates = useMemo(() => { const arr = []; let curr = new Date(startDate); const end = new Date(endDate); while (curr <= end) { arr.push(todayStr(curr)); curr.setDate(curr.getDate() + 1); } return arr; }, [startDate, endDate]);
  const minLen = getMinNoteLength(student);
  let onTimeCount = 0; let lateCount = 0; let brushCount = 0; let hwDoneCount = 0; let hwTotalCount = 0; let totalStudyMin = 0; let noteCount = 0;
  dates.forEach(d => {
    const r = allRec[d] || {};
    if(r.arrival) { if(hmToMin(r.arrival) <= hmToMin(cls.arrivalTarget || '08:50')) onTimeCount++; else lateCount++; }
    if(r.lunchBrushing?.checked) brushCount++;
    const items = hwItemsForDate(allNotice, allRec, d, student);
    hwTotalCount += items.length; hwDoneCount += items.filter(h => h.done).length;
    totalStudyMin += (r.selfStudy||[]).reduce((a,b)=>a+(b.minutes||0),0);
    noteCount += (r.learningNotes||[]).filter(n=>n.content?.length>=minLen).length;
  });
  return (
    <div className="space-y-4">
      <div className="pastel-card p-4"><div className="flex justify-between items-center mb-3"><h3 className="text-lg font-bold">📅 통계 기간</h3><span className="text-xs text-gray-500">{dates.length}일</span></div><div className="flex flex-wrap gap-2 mb-3">{['오늘', '이번 주', '최근 7일', '이번 달', '전체'].map(p => (<button key={p} onClick={()=>handlePreset(p)} className={`px-3 py-1 text-sm rounded-full border ${preset===p ? 'bg-blue-600 text-white font-bold' : 'bg-white'}`}>{p}</button>))}</div></div>
      <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
        <div className="pastel-card p-3 text-center bg-blue-50"><div className="text-xs">🏫 등교 준수</div><div className="text-lg font-bold text-blue-600">정상 {onTimeCount} / 지각 {lateCount}</div></div>
        <div className="pastel-card p-3 text-center bg-yellow-50"><div className="text-xs">⏱ 누적 자습</div><div className="text-lg font-bold text-yellow-600">{totalStudyMin}분</div></div>
        <div className="pastel-card p-3 text-center bg-green-50"><div className="text-xs">🪥 점심 양치</div><div className="text-lg font-bold text-green-600">수행 {brushCount}회</div></div>
        <div className="pastel-card p-3 text-center bg-purple-50"><div className="text-xs">📝 배움노트</div><div className="text-lg font-bold text-purple-600">작성 {noteCount}회</div></div>
        <div className="pastel-card p-3 text-center bg-pink-50"><div className="text-xs">✏ 숙제 수행</div><div className="text-lg font-bold text-pink-600">완료 {hwDoneCount} / {hwTotalCount}</div></div>
      </div>
    </div>
  );
}

function PinChangeModal({student, cls, setCls, onClose,toast}){

  const addType = ()=>{
    const v = newType.trim();
    if(!v){ toast('활동 이름을 입력해 주세요'); return; }
    if(activityTypes.includes(v)){ toast('이미 등록된 활동이에요'); return; }
    setCls({...cls, selfStudyTypes: [...activityTypes, v]});
    setNewType(''); toast('활동 추가!');
  };
  const delType = (t)=>{
    if(!confirm(`'${t}' 활동을 삭제할까요? (학생들의 기존 기록은 보존됩니다)`)) return;
    setCls({...cls, selfStudyTypes: activityTypes.filter(x=>x!==t)});
    toast('삭제!');
  };
  const delStudentRecord = (stu, idx)=>{
    if(!confirm('이 자습 기록을 삭제할까요?')) return;
    Store.patchDay(`records_${stu.id}`, date, day=>({selfStudy:(day.selfStudy||[]).filter((_,i)=>i!==idx)}), {cls, student:stu});
    toast('삭제 완료!');
  };
  return (
    <div className="space-y-3">
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">🛠 자습 활동 관리</h3>
        <p className="text-xs text-gray-500 mb-2">학생들이 자습 시작 버튼에서 고를 수 있는 활동 목록입니다.</p>
        <div className="flex flex-wrap gap-2 mb-3">
          {activityTypes.map(t=>(
            <div key={t} className="px-3 py-1 rounded-xl bg-pink-100 border-2 border-pink-200 flex items-center gap-2">
              <span>{t}</span>
              <button onClick={()=>delType(t)} className="text-red-500 text-xs">×</button>
            </div>
          ))}
        </div>
        <div className="flex gap-2">
          <input value={newType} onChange={e=>setNewType(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addType()} placeholder="새 활동 이름 (예: 한자)" className="border-2 p-2 rounded-xl flex-1"/>
          <button onClick={addType} className="px-3 rounded-xl bg-blue-300 font-bold">추가</button>
        </div>
      </div>
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">📣 오늘의 안내 ({date})</h3>
        <div className="space-y-3">
          <div>
            <div className="text-sm font-bold text-blue-600 mb-1">📣 오늘의 안내 (일반)</div>
            <textarea value={noticeGeneral} onChange={e=>setNoticeGeneral(e.target.value)}
              rows="3" className="w-full border-2 rounded-xl p-2" placeholder="예: 오늘 5교시 후 체육관 이동&#10;알림장 챙기기"/>
          </div>
          <div>
            <div className="text-sm font-bold text-yellow-700 mb-1">📌 오늘의 자습</div>
            <textarea value={noticeSelfStudy} onChange={e=>setNoticeSelfStudy(e.target.value)}
              rows="3" className="w-full border-2 rounded-xl p-2" placeholder="예: 수학 23~25쪽&#10;독서록 한 편"/>
          </div>
          <div className="flex items-center gap-2">
            <span>권장 시간:</span>
            <input type="number" value={recommendedMinutes} onChange={e=>setRecommendedMinutes(+e.target.value)} className="border-2 rounded-xl p-1 w-20"/>분
          </div>
        </div>
        <button onClick={saveNotice} className="mt-3 px-4 py-2 rounded-xl bg-blue-300 font-bold">저장</button>
      </div>
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">학생별 자습 기록 ({date})</h3>
        {cls.students.map(s=>{
          const r = Store.get(`records_${s.id}`,{})[date]||{};
          const list=r.selfStudy||[];
          const total=list.reduce((x,y)=>x+(y.minutes||0),0);
          return (
            <details key={s.id} className="border rounded-xl p-2 mb-2">
              <summary className="cursor-pointer">{s.avatar} {s.number}번 {s.name} — {list.length}개 / {total}분</summary>
              {list.length===0 && <div className="text-xs text-gray-400 pl-4 py-1">기록 없음</div>}
              {list.map((x,i)=>(
                <div key={i} className="text-sm pl-4 py-1 flex items-center justify-between gap-2 border-b border-dashed last:border-b-0">
                  <div className="flex-1">
                    • {x.type} {x.minutes}분 ({isoToLocalHM(x.startTime)}~{x.endTime?isoToLocalHM(x.endTime):'…'}) {x.memo&&`— ${x.memo}`}
                  </div>
                  <button onClick={()=>delStudentRecord(s, i)} className="text-red-500 text-xs bg-red-50 px-2 py-1 rounded">삭제</button>
                </div>
              ))}
            </details>
          );
        })}
      </div>
    </div>
  );
}
/* 📌 교사 숙제 탭 — 체크박스(명시적 값) + 미완료 누적 목록에서 직접 완료 + createdAt 필터 */
function THomework({cls, date, toast}){
  const [allNotice, setAllNotice] = useSync('dailyNotice', {});
  const notice = allNotice[date] || {homework:[]};
  const [s,setS]=useState(''); const [c,setC]=useState(''); const [d,setD]=useState(date);
  const [editIdx, setEditIdx] = useState(-1);
  const [editS, setEditS] = useState('');
  const [editC, setEditC] = useState('');
  const [editD, setEditD] = useState('');
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const unsubs = cls.students.map(stu => Store.subscribe(`records_${stu.id}`, () => setTick(x=>x+1)));
    return () => unsubs.forEach(unsub => unsub());
  }, [cls.students]);
  useEffect(()=>{ setD(date); }, [date]);
  const add=()=>{
    if(!s||!c){toast('과목·내용을 선택/입력해요');return;}
    setAllNotice(prev=>{ const n=(prev||{})[date]||{}; return {...(prev||{}), [date]:{...n, homework:[...(n.homework||[]), {subject:s,content:c,due:d}]}}; });
    setS('');setC(''); toast('추가!');
  };
  const del=(i)=>{
    setAllNotice(prev=>{ const n=(prev||{})[date]||{}; return {...(prev||{}), [date]:{...n, homework:(n.homework||[]).filter((_,x)=>x!==i)}}; });
  };
  const copyPrev=()=>{
    const dates=Object.keys(allNotice).filter(x=>x<date).sort();
    const last = dates[dates.length-1];
    if(!last){toast('이전 알림장이 없어요');return;}
    const curHw = notice.homework||[];
    const prevHw = allNotice[last].homework||[];
    setAllNotice({...allNotice, [date]:{...notice, homework:[...curHw, ...prevHw]}});
    toast(`${last} 알림장 복사!`);
  };
  const startEdit = (i) => {
    setEditIdx(i);
    setEditS(notice.homework[i].subject);
    setEditC(notice.homework[i].content);
    setEditD(notice.homework[i].due);
  };
  const saveEdit = (i) => {
    if(!editS||!editC){toast('과목과 내용을 입력해주세요');return;}
    const hws = [...(notice.homework||[])];
    hws[i] = { ...hws[i], subject: editS, content: editC, due: editD };
    setAllNotice({...allNotice, [date]:{...notice, homework:hws}});
    setEditIdx(-1);
    toast('수정 완료! ✨');
  };
  const cancelEdit = () => setEditIdx(-1);
  const rate = (h)=>{
    let done=0,total=0;
    cls.students.forEach(stu=>{
      if(!isHwVisibleForStudent(stu, date, h)) return;
      const r=Store.get(`records_${stu.id}`,{})[date]||{};
      const m=(r.homework||[]).find(x=>sameHw(x,h,true));
      total++; if(m?.done) done++;
    });
    return `${done}/${total}`;
  };
  /* ===== 교사 직접 체크 =====
     - targetDate: 레코드 날짜(기본: 현재 날짜, 미완료 누적 목록에서는 출제일)
     - forceDone: boolean 이면 그 값으로 설정, 아니면 현재 값 반전 */
  const teacherToggleStudentHw = (stu, hw, isFromTeacher, targetDate = date, forceDone) => {
    const flag = !!isFromTeacher;
    const r = Store.get(`records_${stu.id}`, {})[targetDate] || {};
    const m = (r.homework||[]).find(x=>sameHw(x, hw, flag));
    const nextDone = (typeof forceDone === 'boolean') ? forceDone : !(m && m.done);
    setHomeworkDone(stu, targetDate, hw, flag, nextDone, cls);
  };
  /* ===== 미완료 누적 숙제 (전학생 필터 적용, tick 으로 실시간 갱신) ===== */
  const incompleteByDate = useMemo(()=>{
    const result = [];
    const noticeDates = Object.keys(allNotice||{}).sort();
    noticeDates.forEach(nd => {
      const nh = (allNotice[nd]?.homework)||[];
      if(nh.length===0) return;
      const itemsForDate = [];
      nh.forEach(h => {
        const undoneStudents = [];
        cls.students.forEach(stu => {
          if(!isHwVisibleForStudent(stu, nd, h)) return;
          const r = Store.get(`records_${stu.id}`, {})[nd] || {};
          const m = (r.homework||[]).find(x=>sameHw(x,h,true));
          if(!m?.done) undoneStudents.push(stu);
        });
        if(undoneStudents.length>0) itemsForDate.push({hw:h, undoneStudents});
      });
      if(itemsForDate.length>0) result.push({date:nd, items:itemsForDate});
    });
    return result;
  }, [allNotice, cls.students, tick]);
  return (
    <div className="space-y-3">
      {/* 1. 알림장(숙제) 등록 영역 */}
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">✏ {date} 알림장 등록</h3>
        <div className="flex gap-2 flex-wrap">
          <select value={s} onChange={e=>setS(e.target.value)} className="border-2 p-2 rounded-xl w-32">
            <option value="">— 과목 선택 —</option>
            {cls.subjects.map(subj => <option key={subj.name} value={subj.name}>{subj.name}</option>)}
            <option value="기타">기타</option>
          </select>
          <input value={c} onChange={e=>setC(e.target.value)} placeholder="숙제 내용" className="border-2 p-2 rounded-xl flex-1 min-w-40"/>
          <input type="date" value={d} onChange={e=>setD(e.target.value)} className="border-2 p-2 rounded-xl"/>
          <button onClick={add} className="px-3 rounded-xl bg-blue-300 font-bold">추가</button>
          <button onClick={copyPrev} className="px-3 rounded-xl bg-yellow-200">이전 복사</button>
        </div>
        <ul className="mt-3 space-y-2">
          {(notice.homework||[]).map((h,i)=>(
            <li key={i} className="border rounded-xl p-2 flex flex-wrap items-center gap-2 bg-white">
              {editIdx === i ? (
                <div className="flex-1 flex gap-2 items-center flex-wrap w-full">
                  <select value={editS} onChange={e=>setEditS(e.target.value)} className="border border-gray-300 p-1.5 rounded-lg">
                    {cls.subjects.map(subj => <option key={subj.name} value={subj.name}>{subj.name}</option>)}
                    <option value="기타">기타</option>
                  </select>
                  <input value={editC} onChange={e=>setEditC(e.target.value)} className="border border-gray-300 p-1.5 rounded-lg flex-1 min-w-[200px]" />
                  <input type="date" value={editD} onChange={e=>setEditD(e.target.value)} className="border border-gray-300 p-1.5 rounded-lg text-sm" />
                  <button onClick={()=>saveEdit(i)} className="bg-green-100 text-green-700 px-3 py-1.5 rounded-lg text-sm font-bold">저장</button>
                  <button onClick={cancelEdit} className="bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg text-sm">취소</button>
                </div>
              ) : (
                <>
                  <span className="font-bold">[{h.subject}]</span>
                  <span className="flex-1">{h.content}</span>
                  <span className="text-xs text-gray-500">기한 {h.due}</span>
                  <span className="text-xs text-blue-600 font-bold">완료 {rate(h)}</span>
                  <button onClick={()=>startEdit(i)} className="text-blue-500 text-sm bg-blue-50 px-2 py-1 rounded">수정</button>
                  <button onClick={()=>del(i)} className="text-red-500 text-sm bg-red-50 px-2 py-1 rounded">삭제</button>
                </>
              )}
            </li>
          ))}
        </ul>
      </div>
      {/* 2. 학생별 숙제 현황 + 교사 직접 체크 */}
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">👨‍🎓 학생별 숙제 확인 ({date}) <span className="text-xs text-gray-500 font-normal">— 체크박스를 누르면 학생 화면에 즉시 반영됩니다</span></h3>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          {cls.students.map(stu => {
            const r = Store.get(`records_${stu.id}`, {})[date] || {};
            const stuHw = r.homework || [];
            const teacherHws = (notice.homework || []).filter(th => isHwVisibleForStudent(stu, date, th));
            const doneCount = teacherHws.filter(th => {
              const m = stuHw.find(sh => sameHw(sh, th, true));
              return m?.done;
            }).length;
            const totalCount = teacherHws.length;
            const isAllDone = totalCount > 0 && doneCount === totalCount;
            const personalHws = stuHw.filter(sh => !sh.fromTeacher);
            const personalDoneCount = personalHws.filter(sh => sh.done).length;
            return (
              <div key={stu.id} className={`p-3 border-2 rounded-xl ${isAllDone ? 'bg-green-50 border-green-200' : (totalCount === 0 ? 'bg-gray-50 border-gray-200' : 'bg-red-50 border-red-200')}`}>
                <div className="font-bold mb-2 flex justify-between items-center">
                  <span>{stu.avatar} {stu.number}번 {stu.name}</span>
                  {isAllDone && totalCount > 0 && <span className="text-xl" title="숙제 완료!">🌟</span>}
                </div>
                {totalCount === 0 ? (
                  <div className="text-xs text-gray-500">선생님이 내주신 숙제가 없어요</div>
                ) : (
                  <ul className="text-xs space-y-1.5 mb-1">
                    {teacherHws.map((th, i) => {
                      const m = stuHw.find(sh => sameHw(sh, th, true));
                      const isDone = !!m?.done;
                      return (
                        <li key={i} className="mb-1">
                          <label className="flex items-start gap-1 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={isDone}
                              onChange={(e)=>teacherToggleStudentHw(stu, th, true, date, e.target.checked)}
                              className="mt-0.5"
                            />
                            <div className={isDone ? 'text-gray-500 line-through' : 'font-bold text-red-600'}>
                              {th.subject}: {th.content}
                            </div>
                          </label>
                          {m?.memo && <div className="text-gray-700 ml-5 bg-white p-1.5 rounded-lg border border-gray-200 mt-1">💬 {m.memo}</div>}
                        </li>
                      );
                    })}
                  </ul>
                )}
                {personalHws.length > 0 && (
                  <div className="mt-2 pt-2 border-t border-dashed border-gray-300 text-xs">
                    <span className="text-blue-600 font-bold">✨ 스스로 학습 ({personalDoneCount}/{personalHws.length})</span>
                    <ul className="mt-1 space-y-1.5">
                      {personalHws.map((ph, i) => (
                        <li key={i} className="mb-1">
                          <label className="flex items-start gap-1 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={!!ph.done}
                              onChange={(e)=>teacherToggleStudentHw(stu, ph, false, date, e.target.checked)}
                              className="mt-0.5"
                            />
                            <div className={ph.done ? 'text-gray-500 line-through' : 'text-gray-700'}>
                              {ph.subject}: {ph.content}
                            </div>
                          </label>
                          {ph.memo && <div className="text-gray-500 ml-5 bg-white p-1.5 rounded-lg border border-gray-200 mt-1">💬 {ph.memo}</div>}
                        </li>
                      ))}
                    </ul>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
      {/* 3. 미완료 누적 숙제 대시보드 — 이름 앞 체크박스로 직접 완료 처리 */}
      <div className="pastel-card p-4 border-red-200">
        <h3 className="font-bold mb-2 text-red-700">⏰ 미완료 누적 숙제 목록 <span className="text-xs text-gray-500 font-normal">— 한 명이라도 미완료인 선생님 출제 숙제 · 이름 앞 체크박스를 누르면 완료 처리됩니다</span></h3>
        {incompleteByDate.length === 0 ? (
          <div className="text-sm text-gray-500">현재 미완료 숙제가 없습니다. 🎉</div>
        ) : (
          <div className="space-y-3">
            {incompleteByDate.map(({date:nd, items})=>(
              <div key={nd} className="border-2 border-red-200 rounded-xl p-3 bg-red-50">
                <div className="font-bold text-sm text-red-600 mb-2">📅 {nd}</div>
                <ul className="space-y-2 text-sm">
                  {items.map(({hw, undoneStudents}, i)=>(
                    <li key={i} className="bg-white p-2 rounded-lg border">
                      <div className="font-bold">[{hw.subject}] {hw.content}</div>
                      <div className="text-xs text-gray-500">기한: {hw.due||'-'}</div>
                      <div className="text-xs text-red-500 mt-1 flex flex-wrap items-center gap-x-2 gap-y-1">
                        <span>미완료 {undoneStudents.length}명:</span>
                        {undoneStudents.map(u=>(
                          <label key={u.id} className="inline-flex items-center gap-1 cursor-pointer">
                            <input type="checkbox" checked={false} onChange={()=>teacherToggleStudentHw(u, hw, true, nd, true)} className="w-3.5 h-3.5"/>
                            <span>{u.number}번 {u.name}</span>
                          </label>
                        ))}
                      </div>
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}
function TBrush({cls, setCls, date, toast}){
  const [t,setT]=useState(cls.lunchBrushTime); const [msg,setMsg]=useState(cls.brushNotice||'');
  const save=()=>{ setCls({...cls, lunchBrushTime:t, brushNotice:msg}); toast('저장!'); };
  return (
    <div className="space-y-3">
      <div className="pastel-card p-4"><h3 className="font-bold mb-2">🪥 점심 양치 설정</h3><div className="flex gap-2 mb-2"><input type="time" value={t} onChange={e=>setT(e.target.value)} className="border-2 p-2 rounded-xl"/><button onClick={save} className="px-3 rounded-xl bg-blue-300 font-bold">저장</button></div><textarea value={msg} onChange={e=>setMsg(e.target.value)} rows="2" placeholder="안내 문구" className="w-full border-2 rounded-xl p-2"/></div>
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">학생별 양치 현황 ({date})</h3>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
          {cls.students.map(s=>{
            const [all] = useSync(`records_${s.id}`, {}); const r = all[date]||{}; const ok = r.lunchBrushing?.checked;
            return <div key={s.id} className={`p-2 border-2 rounded-xl ${ok?'bg-green-50':'bg-red-50'}`}>{s.avatar} {s.number}번 {s.name} {ok?`✅ ${isoToLocalHM(r.lunchBrushing.checkedAt)}`:'❌ 미체크'}</div>;
          })}
        </div>
      </div>
    </div>
  );
}
/* 📌 교사 배움노트 탭 — 과목 이모지 프리셋 + minNoteLength 기준 적용 */
function TNote({cls, setCls, date, toast}){
  const [name,setName]=useState(''); const [color,setColor]=useState('#FFD6A5'); const [icon,setIcon]=useState('📘');
  const add=()=>{
    if(!name){toast('과목명을 입력하세요');return;}
    if(cls.subjects.some(s=>s.name===name)){toast('이미 등록된 과목이에요');return;}
    setCls({...cls, subjects:[...cls.subjects,{name,color,icon:icon||'📘'}]}); setName('');
  };
  const del=(n)=>{ setCls({...cls, subjects:cls.subjects.filter(s=>s.name!==n)}); };
  return (
    <div className="space-y-3">
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">📚 과목 관리</h3>
        <div className="flex gap-2 flex-wrap mb-2">
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="과목명" className="border-2 p-2 rounded-xl w-32"/>
          <input value={icon} onChange={e=>setIcon(e.target.value)} placeholder="📘" className="border-2 p-2 rounded-xl w-16"/>
          <input type="color" value={color} onChange={e=>setColor(e.target.value)} className="border-2 rounded-xl"/>
          <button onClick={add} className="px-3 rounded-xl bg-blue-300 font-bold">추가</button>
        </div>
        <div className="text-xs text-gray-500 mb-1">아이콘 프리셋 (클릭해서 선택, 직접 입력도 가능)</div>
        <div className="flex flex-wrap gap-1 mb-3">
          {SUBJECT_ICON_PRESETS.map(e=>(
            <button key={e} type="button" onClick={()=>setIcon(e)} className={`text-xl px-2 py-1 rounded-xl border-2 ${icon===e?'bg-yellow-100 border-yellow-400':'bg-white border-gray-200'}`}>{e}</button>
          ))}
        </div>
        <div className="flex flex-wrap gap-2">
          {cls.subjects.map(s=>(
            <div key={s.name} style={{background:s.color}} className="px-3 py-1 rounded-xl flex items-center gap-2">
              {s.icon} {s.name} <button onClick={()=>del(s.name)} className="text-red-600 text-xs">×</button>
            </div>
          ))}
        </div>
      </div>

function DataExport({cls}){
  const migrateToFirebase = async () => {
    if(!confirm('💾 기존 기기에 저장된(localStorage) 데이터를 Firebase로 복사하시겠습니까?\n(새로운 기기에서 처음 세팅할 때 1회만 권장합니다)')) return;
    const keys = Object.keys(localStorage); let count = 0;
    for(const k of keys) {
      if(['class', 'dailyNotice'].includes(k) || k.startsWith('records_') || k.startsWith('stamps_') || k.startsWith('studentTT_')) {
        try { const val = JSON.parse(localStorage.getItem(k)); await Store.set(k, val); count++; } catch(e){}
      }
    }
    alert(`✅ 마이그레이션 완료! 총 ${count}개의 항목이 Firebase로 동기화되었습니다.`);
  };
  const csv=()=>{
    const dayKor = ['일','월','화','수','목','금','토'];
    const rows=[['날짜','요일','번호','이름','기분(날씨)','등교시간','자습시간(분)','자습상세내용','숙제(완료/전체)','숙제상세내용','양치여부','배움노트(개)','전체달성여부']];
    cls.students.forEach(s=>{
      const all=Store.get(`records_${s.id}`,{});
      const minLen = getMinNoteLength(s);
      Object.keys(all).sort().forEach(d=>{
        const r=all[d]; const dateObj = new Date(d); const dayStr = isNaN(dateObj) ? '' : dayKor[dateObj.getDay()];
        const sm=(r.selfStudy||[]).reduce((x,y)=>x+(y.minutes||0),0);
        const selfDetail=(r.selfStudy||[]).map(x=>`${x.type}(${x.minutes}분)`).join(' | ');
        const hwTotal=(r.homework||[]).length; const hwDone=(r.homework||[]).filter(h=>h.done).length; const hwd=`${hwDone}/${hwTotal}`;
        const hwDetail=(r.homework||[]).map(h=>`${h.subject}:${h.content}(${h.done?'O':'X'})`).join(' | ');
        const brush = r.lunchBrushing?.checked ? 'O' : 'X';
        const noteCount = (r.learningNotes||[]).filter(n=>n.content?.length>=minLen).length;
        const completed = r.completed ? 'O' : 'X';
        const safe = (str) => `"${(str||'').toString().replace(/"/g, '""')}"`;
        rows.push([ d, dayStr, s.number, safe(s.name), r.weather||'', safe(r.arrival), sm, safe(selfDetail), hwd, safe(hwDetail), brush, noteCount, completed ]);
      });
    });
    const csvText = '\uFEFF' + rows.map(r=>r.join(',')).join('\n');
    download('class_all_data_export.csv', csvText, 'text/csv;charset=utf-8;');
  };
  const backup=()=>{
    const data={class:Store.get('class'),dailyNotice:Store.get('dailyNotice')};
    cls.students.forEach(s=>data[`records_${s.id}`]=Store.get(`records_${s.id}`));
    download('backup.json', JSON.stringify(data,null,2),'application/json');
  };
  const restore=(e)=>{
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const j=JSON.parse(r.result); Object.entries(j).forEach(([k,v])=>Store.set(k,v)); alert('복원 완료! 새로고침합니다.'); location.reload(); }catch{alert('파일 형식 오류');} };
    r.readAsText(f);
  };
  const resetAllData = async () => {
    if (window.confirm("🚨 정말로 모든 학급 데이터와 학생 기록을 초기화하시겠습니까?")) {
      localStorage.clear();
      if(window.dbRef) {
        const snap = await window.dbRef.get(); const batch = db.batch();
        snap.forEach(doc => batch.delete(doc.ref)); await batch.commit();
      }
      alert("모든 데이터가 초기화되었습니다."); window.location.reload();
    }
  };
  return (
    <div className="pastel-card p-4">
      <h3 className="font-bold mb-3">💾 전체 데이터 관리</h3>
      <div className="flex flex-wrap gap-2">
        <button onClick={migrateToFirebase} className="px-3 py-2 rounded-xl bg-purple-200 font-bold">🚀 기존 데이터 Firebase로 올리기</button>
        <button onClick={csv} className="px-3 py-2 rounded-xl bg-green-200">📥 전체 CSV 내보내기</button>
        <button onClick={backup} className="px-3 py-2 rounded-xl bg-blue-200">💾 전체 JSON 백업</button>
        <label className="px-3 py-2 rounded-xl bg-yellow-200 cursor-pointer">♻ 복원<input type="file" accept="application/json" onChange={restore} className="hidden"/></label>
        <button onClick={resetAllData} className="px-3 py-2 rounded-xl bg-red-500 text-white font-bold ml-auto">⚠ 전체 초기화</button>
      </div>
    </div>
  );
}
function download(name,content,mime){
  const blob=new Blob([content],{type:mime}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}
/* 📌 학급 관리 — PIN 평문 표시 + 대시보드 권한 + createdAt + minNoteLength */
function TStudents({cls,setCls,toast}){
  const [className, setClassName] = useState(cls.name);
  const [oldPw, setOldPw] = useState(''); const [newPw, setNewPw] = useState(''); const [confirmPw, setConfirmPw] = useState('');
  const [name,setName]=useState(''); const [number,setNumber]=useState(cls.nextStudentId||cls.students.length+1);
  const [csv,setCsv]=useState('');
  const updateClassName = () => {

    setCls({...cls, name: className}); toast('학급명이 변경되었습니다! ✨');
  };
  const updateTeacherPw = async () => {
    if(!oldPw || !newPw || !confirmPw) { toast('비밀번호 칸을 모두 채워주세요.'); return; }
    if(newPw.length < 6) { toast('새 비밀번호는 6자 이상이어야 합니다.'); return; }
    if(newPw !== confirmPw) { toast('새 비밀번호가 서로 다릅니다.'); return; }
    const oldH = await sha256(oldPw);
    if(oldH !== cls.teacherPasswordHash) { toast('현재 비밀번호가 일치하지 않습니다.'); return; }
    const newH = await sha256(newPw);
    setCls({...cls, teacherPasswordHash: newH});
    setOldPw(''); setNewPw(''); setConfirmPw(''); toast('선생님 비밀번호가 변경되었습니다! 🔐');
  };
  const add=async()=>{
    if(!name) return;
    const h = await sha256('0000');
    setCls(prev=>{
      const id = prev.nextStudentId || (prev.students.length+1);
      return {...prev, students:[...prev.students, makeStudent(id, name, +number, h)], nextStudentId:id+1};
    });
    setName(''); setNumber(+number+1); toast('추가!');
  };
  const importCsv=async()=>{
    const lines=csv.trim().split('\n');
    const h = await sha256('0000');
    setCls(prev=>{
      const c={...prev, students:[...prev.students]};
      for(const line of lines){
        const [n,num]=line.split(',').map(x=>x.trim()); if(!n) continue;
        const id=c.nextStudentId||(c.students.length+1);
        c.students.push(makeStudent(id, n, (+num||c.students.length+1), h));
        c.nextStudentId=id+1;
      }
      return c;
    });
    setCsv(''); toast('일괄 등록 완료!');
  };
  const reset=async(s)=>{
    if(!confirm(`${s.name}의 PIN을 0000으로 초기화할까요?`)) return;
    const h = await sha256('0000');
    setCls(prev=>({...prev, students: prev.students.map(x=>x.id===s.id?{...x, pinHash:h, pin:'0000', isPinChanged:false}:x)}));
    toast('초기화 완료!');
  };
  const del=async(s)=>{
    if(!confirm(`${s.name} 학생을 정말 삭제할까요? 기록도 함께 삭제됩니다.`)) return;
    setCls(prev=>({...prev, students: prev.students.filter(x=>x.id!==s.id)}));
    if(window.dbRef){ try{ await window.dbRef.doc(`records_${s.id}`).delete(); }catch{} }
    toast('삭제!');
  };
  const updateMinNoteLength = (sid, v)=>{
    setCls(prev=>({...prev, students: prev.students.map(x=>x.id===sid?{...x, minNoteLength: parseInt(v,10)||10}:x)}));
    toast('기준 글자 수 변경!');
  };
  /* ✅ 대시보드 보기 권한 토글 */
  const toggleDashboard = (sid, v)=>{
    setCls(prev=>({...prev, students: prev.students.map(x=>x.id===sid?{...x, canViewDashboard: !!v}:x)}));
    toast(v ? '대시보드 보기 권한 부여!' : '대시보드 보기 권한 해제');
  };
  return (
    <div className="space-y-3">
      <DataExport cls={cls} />
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">🏫 학급 이름 수정</h3>
        <div className="flex gap-2 flex-wrap">
          <input value={className} onChange={e=>setClassName(e.target.value)} className="border-2 p-2 rounded-xl flex-1 min-w-[200px]" placeholder="예: 3학년 2반"/>
          <button onClick={updateClassName} className="px-4 py-2 rounded-xl bg-orange-200 font-bold">변경</button>
        </div>
      </div>
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">🔐 선생님 비밀번호 변경</h3>
        <div className="flex gap-2 flex-wrap mb-2"><input type="password" value={oldPw} onChange={e=>setOldPw(e.target.value)} placeholder="현재 비밀번호" className="border-2 p-2 rounded-xl flex-1 min-w-[150px]"/></div>
        <div className="flex gap-2 flex-wrap">
          <input type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="새 비밀번호 (6자 이상)" className="border-2 p-2 rounded-xl flex-1 min-w-[150px]"/>
          <input type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} placeholder="새 비밀번호 확인" className="border-2 p-2 rounded-xl flex-1 min-w-[150px]"/>
          <button onClick={updateTeacherPw} className="px-4 py-2 rounded-xl bg-blue-300 font-bold">비밀번호 변경</button>
        </div>
      </div>
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">+ 학생 추가</h3>
        <div className="flex gap-2 flex-wrap">
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="이름" className="border-2 p-2 rounded-xl"/>
          <input type="number" value={number} onChange={e=>setNumber(e.target.value)} placeholder="번호" className="border-2 p-2 rounded-xl w-24"/>
          <button onClick={add} className="px-3 rounded-xl bg-blue-300 font-bold">추가 (PIN 0000)</button>
        </div>
        <div className="mt-3">
          <div className="text-sm font-bold mb-1">CSV 일괄 등록 (이름,번호 / 한 줄에 하나씩)</div>
          <textarea value={csv} onChange={e=>setCsv(e.target.value)} rows="3" placeholder="홍길동,1&#10;김영희,2" className="w-full border-2 rounded-xl p-2"/>
          <button onClick={importCsv} className="mt-2 px-3 py-1 rounded-xl bg-yellow-200">일괄 등록</button>
        </div>
      </div>
      <div className="pastel-card p-4">
        <h3 className="font-bold mb-2">👥 학생 명단 ({cls.students.length}명)</h3>
        <div className="overflow-x-auto">
          <table className="w-full text-sm text-left">
            <thead><tr><th>번호</th><th>아바타</th><th>이름</th><th>PIN 번호</th><th>배움노트 기준</th><th>대시보드</th><th>최근 로그인</th><th></th></tr></thead>
            <tbody>
              {[...cls.students].sort((a,b)=>a.number-b.number).map(s=>(
                <tr key={s.id} className="border-t">
                  <td>{s.number}</td><td className="text-2xl">{s.avatar}</td><td>{s.name}</td>
                  <td className="font-mono">{(s.pin!==undefined && s.pin!==null && s.pin!=='') ? s.pin : <span className="text-gray-400">알 수 없음</span>}</td>
                  <td>
                    <select
                      value={getMinNoteLength(s)}
                      onChange={e=>updateMinNoteLength(s.id, e.target.value)}
                      className="border border-gray-300 rounded p-1 text-sm"
                    >
                      {NOTE_LENGTH_OPTIONS.map(opt=>(
                        <option key={opt} value={opt}>{opt}자</option>
                      ))}
                    </select>
                  </td>
                  <td>
                    <label className="inline-flex items-center gap-1 cursor-pointer text-xs">
                      <input type="checkbox" checked={!!s.canViewDashboard} onChange={e=>toggleDashboard(s.id, e.target.checked)} />
                      <span>{s.canViewDashboard ? '보기 가능' : '-'}</span>
                    </label>
                  </td>
                  <td className="text-xs">{isoToLocalYMDHM(s.lastLogin)}</td>
                  <td className="space-x-1"><button onClick={()=>reset(s)} className="text-blue-600 text-xs">PIN초기화</button><button onClick={()=>del(s)} className="text-red-600 text-xs">삭제</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
